[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptconf"
version = "0.3.0"
description = "Git-like prompt version control for local AI engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "promptconf contributors" }]
keywords = ["prompts", "llm", "versioning", "ai", "templates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
jinja = [
    "jinja2>=3.1.0",
]
git = [
    # Documents the system git CLI dependency for GitStoreBackend.
    # Uses stdlib subprocess — no GitPython required.
]
embeddings = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "jinja2>=3.1.0",
    "hypothesis>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/thatrandomasiandev/promptconf"

[project.scripts]
promptconf = "promptconf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptconf"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
